# Included within nginx's http context (sites-enabled on Ubuntu).
limit_req_zone $binary_remote_addr zone=premium_checkout:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    root /var/www/premiumstore/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 128k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is compressed automatically.
    gzip_types application/javascript application/json text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data:; media-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/payment/request {
        limit_req zone=premium_checkout burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }
    location = /api/admin/media {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Callback query strings and receipt capabilities must not be logged.
        access_log off;
    }
    location ~ /\. { deny all; }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
        # Do not log capability-bearing result URLs.
        access_log off;
    }
}
